version: "3.9"

services:
  ssi-app:
    build:
      context: .
      network: host

    network_mode: host

    environment:
      ACA_PY_URL: "https://cloud-aries-admin.devlab.biz.id"
      ACA_PY_TOKEN: "ISI_ACA_PY_TOKEN"  # holder tenant JWT
      VERIFIER_ACA_PY_URL: "https://cloud-aries-admin.devlab.biz.id"  # default = ACA_PY_URL (multi-tenant, token beda)
      VERIFIER_ACA_PY_TOKEN: "ISI_VERIFIER_ACA_PY_TOKEN"  # verifier tenant JWT — wajib untuk cleanup
      WALLET_CLEANUP_TOKEN: "ISI_WALLET_CLEANUP_TOKEN"  # secret random, harus sama dengan k6 WALLET_CLEANUP_TOKEN
      WALT_ID_TOKEN: "ISI_WALT_ID_TOKEN"
      ENABLE_AUTO_PRESENT: "false"

    restart: unless-stopped

    # gunicorn 1 worker = 1 poller (exactly-once); 2 workers = 2 pollers race
    command: ["gunicorn", "-w", "1", "-k", "gthread", "--threads", "4", "-b", "0.0.0.0:5050", "app:create_app()"]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 30s
      timeout: 5s
      retries: 3
